[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/assembler",
    "crates/programmer",
    "crates/protocol",
    "crates/file-format",
    "crates/cli",
]
# The Tauri desktop app has its own build graph (tauri-build, mobile targets)
# and is built separately via `cargo build` inside desktop/src-tauri.
exclude = ["desktop/src-tauri"]
default-members = ["crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
thiserror = "2"
tracing = "0.1"
