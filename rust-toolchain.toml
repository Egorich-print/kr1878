# Тулчейн репозитория — зафиксирован, чтобы CI и разработчик собирали одно и то же.
#
# Версия 1.99.0 стоит в сборочном контейнере Jenkins (LXC 120, pve-xeon)
# вместе с rustfmt и clippy — это тот же выбор, что и в соседних репозиториях
# инфраструктуры. rustup в контейнере доустанавливает нужную версию сам,
# если её ещё нет.
#
# MSRV (минимальная поддерживаемая версия) объявлен отдельно и строже:
# rust-version = "1.85" в корневом Cargo.toml. Крейты наследуют его
# (rust-version.workspace = true), иначе объявление ничего не значит:
# без него clippy не учитывает MSRV и начинает требовать API новее
# заявленного (например, slice::as_chunks из 1.88).
[toolchain]
channel = "1.99.0"
profile = "minimal"
components = ["rustfmt", "clippy"]
